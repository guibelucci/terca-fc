 if(error)throw Error('Erro ao consultar o histórico dos times: '+error.message);
 return (data||[]).filter(r=>r.dados?.finalizedAt&&(r.dados.finalTeams||r.dados.teams)).slice(0,4).map(r=>r.dados.finalTeams||r.dados.teams);
}
function grupoCompleto(t,side){return [...(t[side]||[]),...(t.bench?.[side]||[])];}
function penalidadeRodizio(red,blue,historico){
 let pontos=0;
 historico.forEach((t,i)=>{
  const peso=4-i,ant=[grupoCompleto(t,'red'),grupoCompleto(t,'blue')];
  for(const grupo of [red,blue])for(let j=0;j<grupo.length;j++)for(let k=j+1;k<grupo.length;k++){
   if(ant.some(a=>a.includes(grupo[j])&&a.includes(grupo[k])))pontos+=peso;
  }
  const ids=[...red,...blue].filter(id=>ant[0].includes(id)||ant[1].includes(id));
  if(ids.length>=10){
   const igual=ids.every(id=>red.includes(id)===ant[0].includes(id));
   const invertido=ids.every(id=>red.includes(id)===ant[1].includes(id));
   if(igual||invertido)pontos+=1000*peso;
  }
 });
 return pontos;
}
function shuffleComRodizio(starters,reserves,extremos,historico,anterior=null){
 // A cor nao tem importancia: medimos somente os parceiros de equipe.
 const ids=[...starters,...reserves],metade=Math.ceil(ids.length/2);
 const grupoAtual=anterior?[grupoCompleto(anterior,'red'),grupoCompleto(anterior,'blue')]:null;
 const anteriores=grupoAtual&&grupoAtual.flat().length===ids.length&&ids.every(id=>grupoAtual.some(g=>g.includes(id)))?grupoAtual:null;
 const minAtletas=Math.ceil(ids.length*0.60);
 function renovacao(red,blue){
  if(!anteriores)return {renovados:ids.length,duplasRepetidas:0,novosParceiros:ids.length};
  const atual=[red,blue];let renovados=0,duplasRepetidas=0,novosParceiros=0;
  for(const id of ids){
   const velho=anteriores.find(g=>g.includes(id))||[];
   const novo=atual.find(g=>g.includes(id))||[];
   const antigos=new Set(velho.filter(x=>x!==id));
   const novos=novo.filter(x=>x!==id&&!antigos.has(x)).length;
   const repetidos=novo.filter(x=>x!==id&&antigos.has(x)).length;
   novosParceiros+=novos;duplasRepetidas+=repetidos;
   // Renovacao significativa: ao menos cinco companheiros diferentes.
   if(novos>=Math.min(5,Math.floor((novo.length-1)/2)))renovados++;
  }
  return {renovados,duplasRepetidas:duplasRepetidas/2,novosParceiros:novosParceiros/2};
 }
 let candidatos=[],menorCusto=Infinity;
 for(let t=0;t<11000;t++){
  const order=[...starters];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  const drawn={red:order.slice(0,7),blue:order.slice(7)};
  if(extremosNoMesmoTime(drawn.red,drawn.blue,extremos))continue;
  const bench=distribuirReservasEquilibradas(drawn,reserves,extremos);if(!bench)continue;
  const red=[...drawn.red,...bench.red],blue=[...drawn.blue,...bench.blue];
  if(Math.abs(red.length-blue.length)>1)continue;
  const renovacaoAtual=renovacao(red,blue);
  if(anteriores&&renovacaoAtual.renovados<minAtletas)continue;
  const equilibrio=cost(red,blue),rodizio=penalidadeRodizio(red,blue,historico);
  menorCusto=Math.min(menorCusto,equilibrio);
  candidatos.push({drawn,bench,equilibrio,rodizio,...renovacaoAtual});
 }
 if(!candidatos.length)return null;
 // Primeiro protege a competitividade; depois minimiza duplas repetidas.
 const limite=menorCusto+Math.max(6,menorCusto*0.20);
 const bons=candidatos.filter(c=>c.equilibrio<=limite)
  .sort((a,b)=>(a.rodizio*1.2+a.duplasRepetidas*2+a.equilibrio)-(b.rodizio*1.2+b.duplasRepetidas*2+b.equilibrio));
 const faixa=bons.slice(0,Math.min(15,bons.length));
 const escolhido=faixa[Math.floor(Math.random()*faixa.length)];
 return {...escolhido,nota:escolhido.equilibrio+escolhido.rodizio*1.2};
}
function suggest(id){let t=current().teams;if(!t)return null;let red=cost([...t.red,id],t.blue),blue=cost(t.red,[...t.blue,id]);return {side:red<=blue?'red':'blue',red,blue}}function baseStats(id){const base=HISTORICO_EXCEL[HISTORICO_EXCEL.length-1]?.players[String(id)]||{};return {points:0,bonus:0,streak:0,goals:0,attendance:0,wins:0,...base}}function points(p){
 let v=Number(baseStats(p.id).points)||0;
 // Recalcula cronologicamente: ausência de registro em rodada encerrada é falta.
 // Não penaliza atletas que não integravam a base histórica oficial e não
 // aparecem na rodada (evita cobrar partidas anteriores ao ingresso).
 const atletaHistorico=HISTORICO_EXCEL.some(h=>Object.prototype.hasOwnProperty.call(h.players||{},String(p.id)));
 completedRounds().forEach(([,r])=>{
  const attendance=r.finalAttendance||r.attendance||{};
  const a=attendance[p.id];
  const times=r.finalTeams||r.teams||{};
  const ids=[...(times.red||[]),...(times.blue||[]),...(times.bench?.red||[]),...(times.bench?.blue||[]),...(times.goalkeepers?.red||[]),...(times.goalkeepers?.blue||[])];
  const participou=ids.some(id=>Number(id)===Number(p.id));
  if(!a&&!atletaHistorico&&!participou)return;
  v=Math.max(0,v+(a?.status==='Presente'||(p.goalkeeper&&a?.status==='Atrasado')?1:a?.status==='Atrasado'?-1:-2));
 });
 return v;
}function historicalBonus(id){
 // Conferido na classificacao oficial anterior a 14/10: Marcio Jap., Leo Branco e Gutti sem bonus (traco).
 // O historico importado usa 0 para ambos os estados, por isso precisa desta conciliacao.
 if([13,16,17].includes(Number(id)))return null;
 const history=HISTORICO_EXCEL.map(h=>h.players[String(id)]).filter(Boolean);
 const last=history.at(-1);if(!last)return null;
 if(Number(last.bonus)>0)return Number(last.bonus);
 // Uma marcação zero só indica proteção quando a trajetória histórica
 // demonstra que um bônus positivo foi consumido até chegar a zero.
 for(let i=history.length-1;i>0;i--){
   const a=Number(history[i-1].bonus||0),b=Number(history[i].bonus||0);
   if(b>0)return null;
   if(a>0&&b===0)return 0;
 }
 return null;
}
// Estados: null = sem proteção (—); 0 = última proteção; N>0 = saldo.
function bonusState(p){
 // Saldo oficial inicial preservado do fechamento da planilha.
 let value=historicalBonus(p.id);
 let streak=Math.max(0,Number(baseStats(p.id).streak)||0)%10;
 for(const [,r] of completedRounds()){
   const status=(r.finalAttendance||r.attendance||{})[p.id]?.status;
   if(status==='Presente'||(p.goalkeeper&&status==='Atrasado')){
     streak++;
     if(streak>=10){
       value=(value===null?0:value)+1;
       streak=0;
     }
   }else{
     // Falta ou ausência de confirmação em rodada finalizada.
     streak=0;
     if(value!==null)value=value>0?value-1:null; // 2→1→0→—
   }
 }
 return value;
}
function bonus(p){return bonusState(p)}

function mesmoConteudoJSON(a,b){
 if(a===b)return true;
 if(a===null||b===null||typeof a!==typeof b)return false;
 if(typeof a!=="object")return false;
 if(Array.isArray(a)!==Array.isArray(b))return false;
 const ka=Object.keys(a).sort(),kb=Object.keys(b).sort();
 return ka.length===kb.length&&ka.every((k,i)=>k===kb[i]&&mesmoConteudoJSON(a[k],b[k]));
}

function ensureExitQueue(r){
 const sub=r.substitutions;if(!sub||sub.exitQueue)return;
 // Migração para rodadas iniciadas na V16: reconstrói a fila a partir das trocas confirmadas.
 sub.exitQueue={red:[],blue:[]};
 for(const side of ['red','blue']){
  const completed=(sub.done||[]).flatMap(d=>d.changes||[]).filter(c=>c.side===side);
  const field=[...r.teams[side]];const initial=[...field];
  for(let i=completed.length-1;i>=0;i--){const c=completed[i];const ix=initial.indexOf(c.in);if(ix>=0)initial.splice(ix,1,c.out);}
  let queue=byTeamRank(initial).reverse();
  for(const c of completed){queue=queue.filter(id=>id!==c.out);queue.push(c.in);}
  sub.exitQueue[side]=[...queue.filter(id=>field.includes(id)),...field.filter(id=>!queue.includes(id))];
 }
}

 if(!pool.includes(id)){alert('O atleta selecionado não está disponível neste grupo.');return;}

function nextSubPlan(){let r=current(),sub=r.substitutions;if(!r.teams||!sub||sub.next>=4)return null;

  const ms=segundosCronometro(c);
  if(acao==='start'){
   if(c.running)throw Error('O cronômetro já está em andamento.');
   if(ms>=2700000)throw Error('Tempo encerrado.');
   c.elapsedMs=ms;c.running=true;c.startedAt=new Date().toISOString();
  }else if(acao==='pause'){
   c.elapsedMs=ms;c.running=false;c.startedAt=null;
  }else if(acao==='next'){
   if(c.half!==1)throw Error('O segundo tempo já foi iniciado.');
   if(!confirm('Encerrar o primeiro tempo e preparar o cronômetro do segundo tempo em 00:00?'))return;
   c.half=2;c.elapsedMs=0;c.running=false;c.startedAt=null;
  }
  next.matchClock=c;
  const {error:writeError}=await salvarRodadaAutorizada({p_data:roundId,p_dados:next,p_versao_esperada:Number(row.versao)});
  if(writeError)throw writeError;
  db.rounds[roundId]=next;save();show();
 }catch(e){alert('Cronômetro não alterado: '+(e.message||e));show()}
 finally{atualizandoCronometro=false}
}
function clockPanel(r){
 const c=r.matchClock||{half:1,elapsedMs:0,running:false};
 const sec=Math.floor(segundosCronometro(c)/1000);
 const display=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 const editable=isMatchOperator()&&!locked()&&!r.finalizedAt;
 const ended=sec>=2700;
 return `<div class="panel" style="text-align:center"><h2>⏱ Cronômetro — ${c.half||1}º tempo</h2><div id="relogio-jogo" style="font-size:56px;font-weight:800;font-variant-numeric:tabular-nums">${display}</div><p class="note">${ended?'45 minutos atingidos':c.running?'Cronômetro em andamento':'Cronômetro pausado'} · gols registrados pelo tempo de jogo</p><div class="row" style="justify-content:center"><button class="primary" onclick="controlarCronometro('start')" ${!editable||c.running||ended?'disabled':''}>▶ Iniciar</button><button onclick="controlarCronometro('pause')" ${!editable||!c.running?'disabled':''}>⏸ Pausar</button>${c.half===1?`<button onclick="controlarCronometro('next')" ${!editable?'disabled':''}>⏭ Encerrar 1º tempo / Preparar 2º</button>`:''}</div></div>`;
}

// Gols de teste: gravação protegida antes de atualizar a tela local.
let golNuvemOcupado=false;
async function alterarGolNuvemTeste(playerId,ownGoal=false,eventId=null){
 if(!mustMatchOperator()||golNuvemOcupado)return;
 if(!supa)return alert('Sem conexão com o Supabase. Gol não lançado.');
 if(roundId<=HIST_FINAL)return;
 const date=roundId;
 const local=db.rounds[date];
 if(!local?.teams||local.finalizedAt)return alert('É necessário ter uma partida em andamento e times sorteados.');
 let team=null;
 if(eventId===null){
  const p=db.players.find(x=>x.id===playerId);
  if(!p)return;
  const t=local.teams;
  const red=[...(t.red||[]),...(local.substitutions?.bench?.red||[]),...(t.goalkeepers?.red||[])];
  const blue=[...(t.blue||[]),...(local.substitutions?.bench?.blue||[]),...(t.goalkeepers?.blue||[])];
  team=red.includes(playerId)?'red':blue.includes(playerId)?'blue':null;
  if(!team)return alert('Atleta não está escalado em nenhum time.');
  if(ownGoal&&!confirm('Confirmar GOL CONTRA de '+p.name+'? Ponto para o time '+(team==='red'?'Azul':'Vermelho')+'.'))return;
 }else if(!confirm('Excluir este lançamento de gol?'))return;
 golNuvemOcupado=true;
 try{
  const {data:row,error:readError}=await supa.from('rodadas').select('dados,versao').eq('data_rodada',date).single();
  if(readError)throw readError;
  if(!row?.dados||!Number.isSafeInteger(Number(row.versao)))throw Error('Rodada remota inválida.');
  if(!mesmoConteudoJSON(local,row.dados)){
   // Nunca aplique um gol sobre uma escalação desatualizada. Atualize a tela e peça nova confirmação.
   db.rounds[date]=structuredClone(row.dados);
   save();show();
   alert('A rodada foi atualizada em outro dispositivo. Os dados mais recentes foram carregados automaticamente. Nenhum gol foi alterado. Confira a tela e repita a operação se ainda desejar.');
   return;
  }
  const next=structuredClone(row.dados);
  if(next.finalizedAt)throw Error('Partida finalizada.');
  if(!Array.isArray(next.goalEvents))next.goalEvents=[];
  if(eventId!==null){
   if(!next.goalEvents.some(x=>String(x.id)===String(eventId)))throw Error('Gol não encontrado na nuvem.');
   next.goalEvents=next.goalEvents.filter(x=>String(x.id)!==String(eventId));
  }else{
   const c=next.matchClock;
   if(!c||!c.running||segundosCronometro(c)>=2700000)throw Error('Inicie o cronômetro para registrar gols durante o tempo de jogo.');
   next.goalEvents.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),playerId,team,ownGoal,at:new Date().toISOString(),gameHalf:c.half,gameSeconds:Math.floor(segundosCronometro(c)/1000)});
  }
  const score={red:0,blue:0};
  for(const g of next.goalEvents){
   const side=g.ownGoal?(g.team==='red'?'blue':'red'):g.team;
   if(side==='red'||side==='blue')score[side]++;
  }
  next.score=score;
  const {error:writeError}=await salvarRodadaAutorizada({p_data:date,p_dados:next,p_versao_esperada:Number(row.versao)});
  if(writeError){
   if(String(writeError.message||'').includes('CONFLITO_VERSAO')){
    const {data:latest,error:reloadError}=await supa.from('rodadas').select('dados').eq('data_rodada',date).single();
    if(!reloadError&&latest?.dados){db.rounds[date]=structuredClone(latest.dados);save();show();}
    alert('Outra alteração foi salva antes desta. A rodada foi atualizada; nenhum gol desta tentativa foi gravado. Confira a tela e tente novamente.');
    return;
   }
   throw writeError;
  }
  db.rounds[date]=next;save();show();
  // Salvamento confirmado sem janela de OK.
 }catch(e){alert('Alteração NÃO salva: '+(e.message||String(e))+'\nNenhuma alteração foi aplicada localmente.');}
 finally{golNuvemOcupado=false;}
}
function registerGoal(id,ownGoal=false){
 if(roundId>HIST_FINAL){alterarGolNuvemTeste(id,ownGoal);return;}
 if(!mustMatchOperator())return;if(roundId<=HIST_FINAL){alert('Histórico importado: não lançar gols nesta rodada.');return}
 let r=current(),p=db.players.find(p=>p.id===id);if(!p||!r.teams)return;
 let team=[...r.teams.red,...(r.substitutions?.bench?.red||[]),...(r.teams.goalkeepers?.red||[])].includes(id)?'red':[...r.teams.blue,...(r.substitutions?.bench?.blue||[]),...(r.teams.goalkeepers?.blue||[])].includes(id)?'blue':null;
 if(!team){alert('Atleta não está escalado em nenhum time.');return}
 if(ownGoal&&!confirm(`Confirmar GOL CONTRA de ${p.name}? Ponto para o time ${team==='red'?'Azul':'Vermelho'}.`))return;
 goalEvents().push({id:Date.now()+'-'+Math.random().toString(36).slice(2),playerId:id,team,ownGoal,at:new Date().toISOString()});r.score=scoreLive();save();show();
}
function undoGoal(eventId){
 if(roundId>HIST_FINAL){alterarGolNuvemTeste(null,false,eventId);return;}
 if(!mustMatchOperator())return;let r=current(),e=goalEvents().find(x=>x.id===eventId);
 if(!e||!confirm('Excluir este lançamento de gol?'))return;
 r.goalEvents=r.goalEvents.filter(x=>x.id!==eventId);r.score=scoreLive();save();show();
}

function converterPendentesEmFalta(attendance){const resultado=structuredClone(attendance||{});for(const p of db.players){if(p.ativo===false||p.excluidoEm)continue;const atual=resultado[p.id];if(!atual||atual.status==='Pendente')resultado[p.id]={...(atual||{}),time:atual?.time||'—',status:'Falta'};}return resultado;}
function finishMatch(){if(roundId>HIST_FINAL){finalizarRodadaNuvemTeste();return;}if(!mustMatchOperator())return;let r=current();if(!r.teams){alert('Sorteie os times antes de finalizar.');return}let sc=scoreLive(),winner=sc.red===sc.blue?'Empate':sc.red>sc.blue?'Vermelho':'Azul';if(!confirm(`FINALIZAR A PARTIDA de ${roundId}?\nPlacar: Vermelho ${sc.red} x ${sc.blue} Azul\nResultado: ${winner}\n\nApós confirmar, esta rodada ficará bloqueada para alterações.`))return;r.score={...sc};r.finalizedAt=new Date().toISOString();r.finalResult=winner;r.finalTeams=JSON.parse(JSON.stringify(r.teams));r.finalTeams.espelhoClassificacao=capturarClassificacaoDoDia();r.finalTeams.espelhoLista=db.players.filter(p=>p.ativo!==false&&!p.excluidoEm).map((p,i)=>({id:p.id,nome:p.name,ordem:i+1,goleiro:!!p.goalkeeper}));r.finalSubstitutions=JSON.parse(JSON.stringify(r.substitutions||{}));r.finalGoals=JSON.parse(JSON.stringify(r.goalEvents||[]));r.attendance=converterPendentesEmFalta(r.attendance);r.finalAttendance=JSON.parse(JSON.stringify(r.attendance));if(db.activeRound===roundId)db.activeRound=null;save();tab='historico';show()}
let classificacaoOficialV28=null;
async function carregarClassificacaoOficialV28(){
 if(!supa)throw Error('Sem conexão com o Supabase.');
 const {data,error}=await supa.from('classificacao_atual').select('ano,atleta_id_legado,posicao,nome,goleiro,pontos,bonus,presenca_bonus,gols,presencas,vitorias,rodada_referencia').eq('ano',2026).order('posicao');
 if(error)throw error;

 classificacaoOficialV28=data;return data;
}
function espelhoClassificacaoOficialV28(){

 return {capturadaEm:new Date().toISOString(),momento:'antes_do_resultado',atletas:classificacaoOficialV28.map(p=>({id:p.atleta_id_legado,nome:p.nome,ordem:p.posicao,goleiro:p.goleiro,pontos:p.pontos,bonus:p.bonus,presencaBonus:p.presenca_bonus,gols:p.gols,presencas:p.presencas,vitorias:p.vitorias}))};
}
let encerramentoNuvemEmCurso=false;
async function finalizarRodadaNuvemTeste(){
 if(encerramentoNuvemEmCurso)return;
 if(!mustMatchOperator()||!supa)return;
 const date=roundId,local=db.rounds[date];
 if(!local?.teams)return alert('Sorteie os times antes de finalizar.');
 encerramentoNuvemEmCurso=true;
 try{
  const {data:row,error:readError}=await supa.from('rodadas').select('dados,versao').eq('data_rodada',date).single();
  if(readError)throw readError;
  if(row.dados.finalizedAt){alert('Esta rodada já está finalizada na nuvem. Nenhuma alteração foi feita.');return;}
  if(!mesmoConteudoJSON(local,row.dados)){
   alert('A rodada foi alterada na nuvem. Nenhuma finalização foi realizada. Carregue a rodada atualizada em Configurações e confira o placar antes de tentar novamente.');return;
  }
  await carregarClassificacaoOficialV28();
  const events=Array.isArray(local.goalEvents)?local.goalEvents:[];
  const score={red:0,blue:0};
  for(const event of events){
   const side=event.ownGoal?(event.team==='red'?'blue':'red'):event.team;
   if(side==='red'||side==='blue')score[side]++;
  }
  const winner=score.red===score.blue?'Empate':score.red>score.blue?'Vermelho':'Azul';
  if(!confirm('FINALIZAR A RODADA '+date+' NA NUVEM?\nPlacar: Vermelho '+score.red+' x '+score.blue+' Azul\nResultado: '+winner+'\n\nA rodada ficará bloqueada para edição.'))return;
  const next=structuredClone(local);
  next.score=score;
  if(next.matchClock?.running){next.matchClock.elapsedMs=segundosCronometro(next.matchClock);next.matchClock.running=false;next.matchClock.startedAt=null;}
  next.finalizedAt=new Date().toISOString();
  next.finalResult=winner;
  next.finalTeams=structuredClone(next.teams);
  next.finalTeams.espelhoClassificacao=espelhoClassificacaoOficialV28();
  next.finalTeams.espelhoLista=db.players.filter(p=>p.ativo!==false&&!p.excluidoEm).map((p,i)=>({id:p.id,nome:p.name,ordem:i+1,goleiro:!!p.goalkeeper}));
  next.finalSubstitutions=structuredClone(next.substitutions||{});
  next.finalGoals=structuredClone(next.goalEvents||[]);
  next.attendance=converterPendentesEmFalta(next.attendance);
  next.finalAttendance=structuredClone(next.attendance);
  const {data:newVersion,error:writeError}=await supa.rpc('finalizar_rodada_v28',{
   p_data:date,p_dados:next,p_versao_esperada:Number(row.versao),p_token:isAdmin()?null:controladorToken
  });
  if(writeError){
   if(String(writeError.message||'').includes('CONFLITO_VERSAO')){
    alert('Outro dispositivo atualizou a rodada. Não foi finalizada. Recarregue a rodada da nuvem e tente novamente.');return;
   }
   throw writeError;
  }
  const {data:verified,error:verifyError}=await supa.from('rodadas').select('dados,versao').eq('data_rodada',date).single();
  if(verifyError)throw verifyError;
  if(!verified.dados?.finalizedAt||!mesmoConteudoJSON(verified.dados,next)){
   alert('A gravação foi enviada, mas não foi possível confirmar todos os dados. Consulte o Histórico na nuvem antes de tentar novamente.');return;
  }
  db.rounds[date]=structuredClone(verified.dados);
  if(db.activeRound===date)db.activeRound=null;
  save();
  await atualizarEstatisticasNuvem();
  tab='historico';show();carregarHistoricoRemoto();
  alert('Rodada finalizada no Supabase (versão '+newVersion+'). Confira o Histórico.');
 }catch(e){alert('Não foi possível finalizar a rodada: '+(e.message||String(e)));}
 finally{encerramentoNuvemEmCurso=false;}
}

function capturarRascunhoAvaliacoes(){
 const rascunho={};
 if(!authenticatedVoter)return rascunho;
 for(const id of requiredTargets(authenticatedVoter)){
  const lv=document.getElementById('lv'+id),sp=document.getElementById('sp'+id),po=document.getElementById('po'+id);
  if(lv&&sp&&po)rascunho[id]={level:lv.value,speed:sp.value,position:po.value};
 }
 return rascunho;
}
function restaurarRascunhoAvaliacoes(rascunho,exceto){
 for(const [id,v] of Object.entries(rascunho)){
  if(Number(id)===exceto)continue;
  const lv=document.getElementById('lv'+id),sp=document.getElementById('sp'+id),po=document.getElementById('po'+id);
  if(lv)lv.value=v.level;
  if(sp)sp.value=v.speed;
  if(po)po.value=v.position;
 }
}
async function vote(voterId,target){
 if(avaliacoesEmLote)return;
 if(authenticatedVoter!==voterId||voterId===target||!currentPin||!supa||!requiredTargets(voterId).includes(target))return alert('Atleta indisponível para avaliação.');
 const level=Number(document.getElementById('lv'+target).value),speed=Number(document.getElementById('sp'+target).value),position=document.getElementById('po'+target).value;
 if(!Number.isInteger(level)||level<1||level>7||!Number.isInteger(speed)||speed<1||speed>5||!['Zagueiro','Meia','Atacante'].includes(position))return alert('Preencha os três critérios deste atleta.');
 const rascunho=capturarRascunhoAvaliacoes();
 const btn=document.getElementById('salvarAtleta'+target);
 avaliacoesEmLote=true;
 if(btn){btn.disabled=true;btn.textContent='Salvando...';}
 try{
  const {data,error}=await supa.rpc('salvar_avaliacao_atleta',{p_avaliador_id_legado:voterId,p_pin:currentPin,p_avaliado_id_legado:target,p_nota_tecnica:level,p_mobilidade:mobilityLabels[speed-1],p_posicao:position});
  if(error||data!==true)throw Error(error?.message||'Não foi possível confirmar o salvamento.');
  await refreshMyVotes();

  await refreshSummary();

 }catch(e){
  restaurarRascunhoAvaliacoes(rascunho);
  alert('Falha ao salvar avaliação: '+e.message);
 }finally{
  avaliacoesEmLote=false;
  const botao=document.getElementById('salvarAtleta'+target);
  if(botao){botao.disabled=false;botao.textContent='☁ Salvar';}
 }
}
let avaliacoesEmLote=false;
async function salvarTodasAvaliacoes(){
 if(avaliacoesEmLote)return;
 const id=authenticatedVoter;
 if(!id||!currentPin||!supa)return alert('Identifique-se antes de salvar as avaliações.');
 const targets=requiredTargets(id);
 const pendentes=[];
 for(const target of targets){
  const lv=document.getElementById('lv'+target),sp=document.getElementById('sp'+target),po=document.getElementById('po'+target);
  if(!lv||!sp||!po)return alert('A tela de avaliações mudou. Abra novamente e tente salvar.');
  const level=Number(lv.value),speed=Number(sp.value),position=po.value;
  if(!level&&!speed&&!position)continue;
  if(!Number.isInteger(level)||level<1||level>7||!Number.isInteger(speed)||speed<1||speed>5||!['Zagueiro','Meia','Atacante'].includes(position)){
   const nome=db.players.find(p=>p.id===target)?.name||'atleta '+target;
   alert('Preencha os três critérios de '+nome+' ou deixe os três vazios para avaliar depois.');
   lv.focus();return;
  }
  const antigo=db.votes[id]?.[target];
  if(!antigo||antigo.level!==level||antigo.speed!==speed||antigo.position!==position)pendentes.push({target,level,speed,position});
 }
 if(!pendentes.length){const st=document.getElementById('statusSalvarAvaliacoes');if(st)st.textContent='Nenhuma avaliação nova para salvar.';return;}
 avaliacoesEmLote=true;
 const btn=document.getElementById('salvarTodasAvaliacoes'),status=document.getElementById('statusSalvarAvaliacoes');
 if(btn)btn.disabled=true;
 let salvas=0,erro=null;
 try{
  for(const v of pendentes){
   if(status)status.textContent='Salvando '+(salvas+1)+' de '+pendentes.length+' avaliações...';
   const {data,error}=await supa.rpc('salvar_avaliacao_atleta',{p_avaliador_id_legado:id,p_pin:currentPin,p_avaliado_id_legado:v.target,p_nota_tecnica:v.level,p_mobilidade:mobilityLabels[v.speed-1],p_posicao:v.position});
   if(error||data!==true){erro='Falha ao salvar '+(db.players.find(p=>p.id===v.target)?.name||v.target)+': '+(error?.message||'Não confirmado');break;}
   salvas++;
  }
  const rascunho=capturarRascunhoAvaliacoes();
  await refreshMyVotes();restaurarRascunhoAvaliacoes(rascunho);
  await refreshSummary();restaurarRascunhoAvaliacoes(rascunho);
  if(erro)alert(erro+'\n'+salvas+' avaliação(ões) foram salvas. Confira as pendentes e tente novamente.');
  else {const st=document.getElementById('statusSalvarAvaliacoes');if(st)st.textContent='✓ '+salvas+' avaliação(ões) salvas no Supabase.';}
 }catch(e){alert('Erro ao salvar avaliações: '+(e.message||String(e))+'\nConfira as avaliações antes de tentar novamente.');}
 finally{avaliacoesEmLote=false;const b=document.getElementById('salvarTodasAvaliacoes');if(b)b.disabled=false;}
}

async function deleteAthletePermanently(id){
 if(!isAdmin()||!supa)return alert('Acesso exclusivo ao administrador.');
 const p=db.players.find(x=>x.id===id);
 if(!p||p.excluidoEm)return alert('Atleta não encontrado ou já excluído.');
 if(!confirm(`EXCLUSÃO PERMANENTE DO CADASTRO\n\n${p.name} será removido das listas atuais e perderá o PIN. O histórico das rodadas será preservado.\n\nDeseja continuar?`))return;
 const typed=prompt(`Para confirmar a exclusão de ${p.name}, digite exatamente EXCLUIR:`);
 if(typed!=='EXCLUIR')return alert('Exclusão cancelada.');
 // A senha é enviada apenas à autenticação do Supabase, nunca armazenada no app.
 const password=prompt('Digite sua SENHA ADMINISTRATIVA para confirmar a exclusão:');
 if(!password)return alert('Exclusão cancelada.');
 try{
  const {data:verified,error:authError}=await supa.auth.signInWithPassword({email:authUser.email,password});
  if(authError||!verified?.user||verified.user.id!==authUser.id)throw Error('Senha administrativa inválida.');

  const {data,error}=await supa.rpc('excluir_atleta_admin',{p_atleta_id:uuid});

 }catch(e){alert('Exclusão NÃO concluída: '+e.message)}
}

function protectedRanking(items){
 // A ordem do fechamento da planilha é a referência, não a ordem por pontos.
 let ordered=items.filter(p=>!p.goalkeeper).sort((a,b)=>(baseStats(a.id).rank??999)-(baseStats(b.id).rank??999)||a.id-b.id);
 const goleiros=items.filter(p=>p.goalkeeper);
 // Um jogador só ultrapassa outro se tiver pontuação maior (ou desempate
 // por presenças) E o atleta imediatamente à frente não tiver bônus.
 // Rodadas novas atualizam os pontos, mas não removem proteção existente.
 let changed=true,passes=0;
 while(changed&&passes++<ordered.length){
   changed=false;
   for(let i=1;i<ordered.length;i++){
     let ahead=ordered[i-1],behind=ordered[i];
     if(ahead.bonus!==null)continue;
     if(behind.points>ahead.points||(behind.points===ahead.points&&behind.attendance>ahead.attendance)){
       ordered[i-1]=behind;ordered[i]=ahead;changed=true;
     }
   }
 }
 // Goleiros ficam sempre nas últimas posições da Lista e não disputam
 // subida na classificação dos atletas de linha.
 const ordemGoleiros={27:0,28:1,30:2};
 return [
   ...ordered.filter(p=>!p.goalkeeper),
   ...goleiros.sort((a,b)=>

let buscaRodadaAtivaOcupada=false;
let dataRemotaExibida=null;
async function buscarRodadaAtivaAutomatica(){

 try{
  const {data,error}=await supa.from('rodadas').select('data_rodada,dados,versao').order('data_rodada',{ascending:false}).limit(200);
  if(error)throw error;
  const rows=(data||[]).filter(x=>x.dados&&typeof x.dados==='object'&&!Array.isArray(x.dados));

}

 area.innerHTML='<div class="panel"><h2>📖 '+esc(date.split('-').reverse().join('/'))+'</h2>'+'<button onclick="imprimirEspelhoRodada(\''+esc(date)+'\')">🖨️ Imprimir espelho do dia</button> '+(isAdmin()?'<button class="danger" onclick="excluirHistoricoNuvem(\''+esc(date)+'\')">🗑 Excluir histórico</button>':'')+'<h3>🔴 '+Number(sc.red||0)+' × '+Number(sc.blue||0)+' 🔵</h3><p>Finalizada em '+new Date(r.finalizedAt).toLocaleString('pt-BR')+' · '+present.length+' presentes</p></div><div class="grid">'+sideHtml('red')+sideHtml('blue')+'</div><div class="panel"><h3>⚽ Gols da partida</h3>'+goals+'</div><div class="panel"><h3>✓ Presenças</h3><div class="scroll">'+attendance+'</div></div><p class="note">Súmula consultada diretamente do Supabase. Nenhum ponto ou bônus foi recalculado.</p>';
}

async function excluirHistoricoNuvem(date){
 if(!isAdmin()||!supa)return alert('Apenas o administrador pode excluir o histórico.');
 if(date<=HIST_FINAL)return alert('O histórico original da planilha está protegido.');
 const item=historicoRemotoCache.find(x=>x.data_rodada===date);
 if(!item||!item.dados?.finalizedAt)return alert('Selecione uma rodada finalizada da nuvem.');
 if(!confirm('Excluir DEFINITIVAMENTE a rodada '+date.split('-').reverse().join('/')+'? Presenças, gols, resultados e pontuação desta rodada deixarão de contar.'))return;
 if(prompt('Para confirmar, digite EXCLUIR:')!=='EXCLUIR')return alert('Exclusão cancelada.');
 if(!await reauthenticateAdmin('Excluir histórico de '+date))return;
 try{
  const {data,error}=await supa.rpc('excluir_rodada_admin',{p_data:date});
  if(error)throw error;
  if(data!==true)throw Error('O servidor não confirmou a exclusão.');
  delete db.rounds[date];delete nuvemEstatisticas[date];
  if(db.activeRound===date)db.activeRound=null;
  if(roundId===date)roundId=tuesday(new Date());
  save();
  await atualizarEstatisticasNuvem();
  await carregarClassificacaoOficialV28();
  await carregarHistoricoRemoto();
  alert('Rodada excluída no Supabase. Histórico e classificação atualizados.');
 }catch(e){alert('Não foi possível excluir: '+(e.message||String(e))+'\nVerifique se a função SQL excluir_rodada_admin foi instalada.')}
}

function config(){let url=location.href.split('?')[0].split('#')[0]+'?avaliar=1';return `<div class="panel"><h2>Administração</h2><p>Modo atual: <b>${isAdmin()?'Administrador':'Visualização'}</b></p><button class="primary" onclick="login()">${isAdmin()?'Sair do administrador':'Entrar como administrador'}</button>${isAdmin()?'<button onclick="changeAdminPassword()">🔑 Alterar senha</button>':'<button onclick="resetAdminPassword()">Esqueci minha senha</button>'}${!supabaseReady()?'<p class="bad">⚠ Configure supabase-config.js antes de usar o login.</p>':''}<p class="note">Dados das rodadas e avaliações sincronizados com o Supabase.</p><label>Consultar data da rodada <input type="date" value="${roundId}" onchange="roundId=this.value;show()"></label><div class="bar"><button onclick="exportData()">Exportar dados JSON</button><button onclick="importData()">Importar JSON</button></div><p class="note">O arquivo JSON exporta dados locais de apoio e não substitui o histórico do Supabase.</p><button class="danger" onclick="resetRound()" ${!isAdmin()||locked()?'disabled':''}>Apagar rodada atual</button></div>${isAdmin()?`<div class="panel"><h2>🔑 Acesso e avaliações</h2><label><input type="checkbox" ${db.testMode?'checked':''} onchange="setTestMode(this.checked)"> Permitir presença sem avaliação completa</label><p class="note">Quando ativado, o administrador pode registrar a presença mesmo que o atleta ainda não tenha concluído as avaliações. As avaliações continuam registradas no Supabase.</p><p><b>Endereço para QR Code:</b> <a href="${esc(url)}">${esc(url)}</a></p><p class="note">Compartilhe este QR Code com os atletas para acessar as avaliações.</p><img width="180" height="180" alt="QR Code para avaliação" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}"><div class="scroll"><table class="table"><thead><tr><th>Atleta</th><th>Código</th><th>Avaliações</th><th>Habilitado</th><th>Ação</th></tr></thead><tbody>${db.players.filter(p=>!p.excluidoEm).map(p=>`<tr><td>${esc(p.name)}</td><td><code>${esc(db.pins[p.id]||'—')}</code></td>${adminEvaluationStatus(p)}<td><button onclick="changePin(${p.id})">Alterar código</button></td></tr>`).join('')}</tbody></table></div></div>`:''}`}
let supa=null,authUser=null;
function supabaseReady(){let c=window.TERCA_CONFIG||{};return !!(c.url&&c.anonKey&&c.adminEmail&&window.supabase?.createClient)}
async function initAuth(){db.admin=false;if(!supabaseReady()){show();return}try{supa=window.supabase.createClient(window.TERCA_CONFIG.url,window.TERCA_CONFIG.anonKey);buscarRodadaAtivaAutomatica();atualizarEstatisticasNuvem();await syncAthletes();await carregarClassificacaoOficialV28().catch(console.warn);await carregarIndicadosFutebol();let {data,error}=await supa.auth.getUser();if(!error)authUser=data.user||null;await refreshSummary();if(isAdmin()){await refreshAdminPins();await refreshAdminEvaluationCounts();}supa.auth.onAuthStateChange((event,session)=>{authUser=session?.user||null;if(!isAdmin()){db.pins={};pinsLoaded=false;adminEvaluationCounts=null}else {refreshAdminPins();refreshAdminEvaluationCounts()}show();if(event==='PASSWORD_RECOVERY')setTimeout(async()=>{let password=prompt('Nova senha de recuperação (mínimo 12 caracteres):');if(!password||password.length<12)return alert('Senha não alterada.');let {error}=await supa.auth.updateUser({password});if(error)return alert(error.message);await supa.auth.signOut();authUser=null;show();alert('Senha redefinida. Entre novamente.')},0)});show()}catch(e){console.error('Erro ao inicializar autenticação',e);show()}}
function fecharAcessoAdmin(){document.getElementById('modal-acesso-admin')?.remove()}
function abrirAcessoAdmin(){
 fecharAcessoAdmin();
 const overlay=document.createElement('div');overlay.id='modal-acesso-admin';
 overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px';
 overlay.innerHTML=`<div role="dialog" aria-modal="true" aria-labelledby="titulo-acesso-admin" style="width:min(100%,420px);background:#15253b;color:#fff;border:1px solid #36516d;border-radius:14px;padding:24px;box-shadow:0 18px 50px #0009">
 <h2 id="titulo-acesso-admin" style="margin-top:0">🔐 Acesso administrador</h2>
 <form id="form-acesso-admin" style="display:grid;gap:12px">
 <label style="display:grid;gap:5px">E-mail<input id="email-acesso-admin" type="email" required autocomplete="username" value="${esc(String(window.TERCA_CONFIG?.adminEmail||''))}" style="width:100%;box-sizing:border-box"></label>
 <label style="display:grid;gap:5px">Senha<input id="senha-acesso-admin" type="password" required autocomplete="current-password" style="width:100%;box-sizing:border-box"></label>
 <button class="primary" type="submit">Entrar como administrador</button>
 </form>
 <button type="button" id="esqueci-acesso-admin" style="margin-top:12px">Esqueci minha senha</button>
 <button type="button" id="cancelar-acesso-admin" style="margin-top:12px">Cancelar</button>
 <p id="status-acesso-admin" role="status" style="margin-bottom:0"></p>
 </div>`;
 document.body.appendChild(overlay);
 overlay.addEventListener('click',e=>{if(e.target===overlay)fecharAcessoAdmin()});
 overlay.querySelector('#cancelar-acesso-admin').onclick=fecharAcessoAdmin;
 overlay.querySelector('#esqueci-acesso-admin').onclick=async()=>{await resetAdminPassword()};
 overlay.querySelector('#form-acesso-admin').onsubmit=async e=>{
 e.preventDefault();const email=overlay.querySelector('#email-acesso-admin').value.trim().toLowerCase();const password=overlay.querySelector('#senha-acesso-admin').value;
 const status=overlay.querySelector('#status-acesso-admin');
 if(email!==String(window.TERCA_CONFIG.adminEmail).toLowerCase()){status.textContent='E-mail não autorizado para administração.';return}
 const btn=overlay.querySelector('button[type=submit]');btn.disabled=true;status.textContent='Verificando acesso...';
 try{const {data,error}=await supa.auth.signInWithPassword({email,password});
 if(error){status.textContent='Não foi possível entrar. Confira e-mail e senha.';return}
 authUser=data.user;
 if(isAdmin()){await refreshAdminPins();await refreshAdminEvaluationCounts();}
 if(!isAdmin()){await supa.auth.signOut();authUser=null;status.textContent='Esta conta não tem permissão administrativa.';return}
 fecharAcessoAdmin();show();
 }catch(err){status.textContent='Não foi possível entrar. Tente novamente.'}finally{btn.disabled=false}
 };
 overlay.querySelector('#senha-acesso-admin').focus();
}
async function login(){if(!supa)return alert('Configure supabase-config.js com os dados públicos do seu projeto Supabase.');if(isAdmin()){await supa.auth.signOut();authUser=null;show();return}abrirAcessoAdmin()}
async function reauthenticateAdmin(action){if(!isAdmin()||!supa)return false;let pwd=prompt('Confirme sua senha atual para: '+action);if(!pwd)return false;let {error}=await supa.auth.signInWithPassword({email:authUser.email,password:pwd});if(error){alert('Senha atual incorreta.');return false}return true}
async function changeAdminPassword(){if(!isAdmin()||!supa)return;let current=prompt('Senha atual:');if(current===null)return;let {error:loginError}=await supa.auth.signInWithPassword({email:authUser.email,password:current});if(loginError)return alert('Senha atual incorreta.');let next=prompt('Nova senha (mínimo de 12 caracteres):');if(next===null)return;if(next.length<12)return alert('Use pelo menos 12 caracteres.');let confirmPwd=prompt('Repita a nova senha:');if(confirmPwd!==next)return alert('As senhas não coincidem.');let {error}=await supa.auth.updateUser({password:next});if(error)return alert('Não foi possível alterar a senha: '+error.message);await supa.auth.signOut();authUser=null;show();alert('Senha alterada. Entre novamente com a nova senha.')}
async function resetAdminPassword(){if(!supa)return alert('Supabase ainda não configurado.');let email=String(window.TERCA_CONFIG.adminEmail||'');if(!email)return alert('Defina o e-mail do administrador.');let {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return alert('Erro ao solicitar recuperação: '+error.message);alert('Se a conta estiver cadastrada, o e-mail de recuperação será enviado.')}
function resetRound(){if(!mustAdmin())return;if(roundId<=HIST_FINAL){alert('Rodada histórica protegida. Escolha uma data posterior a 13/10/2026.');return}if(confirm('Apagar presença, times e placar desta rodada?')){delete db.rounds[roundId];if(db.activeRound===roundId)db.activeRound=null;save();show()}}function exportData(){let blob=new Blob([JSON.stringify({...db,admin:false},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='terca-fc-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(){alert('Importação bloqueada nesta versão para proteger os dados do Supabase.');return;if(!mustAdmin())return;let el=document.createElement('input');el.type='file';el.accept='.json';el.onchange=()=>{let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.players)||!d.rounds||!d.votes)throw Error('Formato inválido');if(confirm('Substituir todos os dados atuais pelo backup?')){db={...d,admin:false};save();show()}}catch(e){alert(e.message)}};reader.readAsText(el.files[0])};el.click()};db.votes={};db.pins={};save();initAuth();if(tab==='historico')carregarHistoricoRemoto();
</script></body></html>
