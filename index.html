function initializeSubs(r){

function ensureExitQueue(r){
 const sub=r.substitutions;if(!sub||sub.exitQueue)return;
 // Migração para rodadas iniciadas na V16: reconstrói a fila a partir das trocas confirmadas.
 sub.exitQueue={red:[],blue:[]};

  const completed=(sub.done||[]).flatMap(d=>d.changes||[]).filter(c=>c.side===side);
  const field=[...r.teams[side]];const initial=[...field];
  for(let i=completed.length-1;i>=0;i--){const c=completed[i];const ix=initial.indexOf(c.in);if(ix>=0)initial.splice(ix,1,c.out);}
  let queue=byTeamRank(initial).reverse();
  for(const c of completed){queue=queue.filter(id=>id!==c.out);queue.push(c.in);}
  sub.exitQueue[side]=[...queue.filter(id=>field.includes(id)),...field.filter(id=>!queue.includes(id))];
 }
}

 if(!pool.includes(id)){alert('O atleta selecionado não está disponível neste grupo.');return;}

 const edits=sub.manual[sub.next];
 const key=side+':'+index;
 const proposed=Object.fromEntries(Object.entries(edits).map(([k,v])=>[k,{...v}]));
 proposed[key]??={};proposed[key][kind]=id;

 actual[globalIndex][kind]=id;

 for(const c of actual){const k=c.side+':'+kind+':'+c[kind];if(used.has(k)){alert('Este jogador já foi selecionado nesta troca.');show();return;}used.add(k)}

function nextSubPlan(){let r=current(),sub=r.substitutions;if(!r.teams||!sub||sub.next>=4)return null;

  const bench=byTeamRank(sub.bench[side]||[]);

  const n=Math.min(bench.length,field.length);
  for(let i=0;i<n;i++){
   const edit=sub.manual?.[sub.next]?.[side+':'+i]||{};
   changes.push({side,out:field.includes(edit.out)?edit.out:queue[i],in:bench.includes(edit.in)?edit.in:bench[i]});

function confirmSub(){if(!mustAdmin()||locked())return;let r=current(),plan=nextSubPlan();if(!plan)return;

  const group=plan.changes.filter(c=>c.side===side),outs=group.map(c=>c.out),ins=group.map(c=>c.in);

 }
 if(!confirm('Confirmar '+(r.substitutions.next+1)+'ª troca aos '+plan.minute+' minutos?'))return;
 for(const side of ['red','blue']){

function ratings(){ensurePins();let id=authenticatedVoter,p=db.players.find(x=>x.id===id);let targets=p?requiredTargets(id):[];let done=targets.filter(t=>db.votes[id]?.[t]&&['Zagueiro','Meia','Atacante'].includes(db.votes[id][t].position)).length;return `<div class="panel"><h2>⭐ Avaliação dos atletas</h2><p class="note">Selecione seu nome, confirme seu código de quatro dígitos e avalie todos os demais jogadores de linha. Ninguém pode avaliar a si mesmo.</p>${!p?`<label>Seu nome <select id="identityName"><option value="">Selecione</option>${db.players.filter(x=>!x.goalkeeper).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Código individual <input id="identityPin" type="password" inputmode="numeric" maxlength="4" placeholder="4 dígitos"></label><button class="primary" onclick="identifyVoter()">Confirmar identidade</button>`:`<div class="row"><b>${esc(p.name)} — ${done}/${targets.length} avaliações</b><button onclick="exitVoter()">Sair</button></div><p class="${evaluationComplete(id)?'ok':'warn'}">${evaluationComplete(id)?'✓ Avaliação concluída — habilitado':'Avaliações pendentes: '+(targets.length-done)}</p><div class="scroll"><table class="table"><thead><tr><th>Atleta</th><th>Técnica</th><th>Mobilidade</th><th>Posição</th><th>Ação</th></tr></thead><tbody>${db.players.filter(x=>targets.includes(x.id)).map(x=>{let v=db.votes[id]?.[x.id]||{};return `<tr><td>${esc(x.name)} ${v.level?'✓':''}</td><td><select id="lv${x.id}"><option value="">—</option>${[1,2,3,4,5,6,7].map(n=>`<option ${v.level===n?'selected':''} value="${n}">${n} ★</option>`).join('')}</select></td><td><select id="sp${x.id}"><option value="">—</option>${['Muito lento','Lento','Médio','Rápido','Muito rápido'].map((label,i)=>`<option value="${i+1}" ${v.speed===i+1?'selected':''}>${label}</option>`).join('')}</select></td><td><select id="po${x.id}"><option value="">—</option>${['Zagueiro','Meia','Atacante'].map(label=>`<option ${v.position===label?'selected':''}>${label}</option>`).join('')}</select></td><td><button onclick="vote(${id},${x.id})">Salvar</button></td></tr>`}).join('')}</tbody></table></div>`}</div>`}
function vote(voterId,target){if(authenticatedVoter!==voterId||voterId===target)return alert('Acesso inválido.');let level=Number(document.getElementById('lv'+target).value),speed=Number(document.getElementById('sp'+target).value),position=document.getElementById('po'+target).value;if(!level||!speed||!['Zagueiro','Meia','Atacante'].includes(position)){alert('Preencha os três critérios.');return}db.votes[voterId]??={};db.votes[voterId][target]={level,speed,position};save();show()}
function athletes(){return `<div class="panel"><div class="row"><h2>Cadastro e perfil dos atletas</h2><button class="primary" onclick="addPlayer()" ${!isAdmin()?'disabled':''}>+ Novo atleta</button></div><div class="scroll"><table class="table"><thead><tr><th>Nome</th><th>Nível</th><th>Mobilidade</th><th>Posição</th><th>Avaliações</th></tr></thead><tbody>${scores().map(p=>`<tr><td>${esc(p.name)} ${p.goalkeeper?'🧤':''}</td><td>${p.level===null?'—':p.level.toFixed(1)+' ★'}</td><td>${p.speed===null?'—':p.speed.toFixed(1)+'/5'}</td><td>${esc(p.position)}</td><td>${p.n}</td></tr>`).join('')}</tbody></table></div></div>`}function addPlayer(){if(!mustAdmin())return;let name=prompt('Nome do atleta:')?.trim();if(!name)return;if(db.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return alert('Atleta já cadastrado');let id=Math.max(...db.players.map(p=>p.id))+1;db.players.push({id,name,goalkeeper:confirm('Este atleta é goleiro?')});db.pins[id]=makePin();save();show()}
function protectedRanking(items){
 // A ordem do fechamento da planilha é a referência, não a ordem por pontos.
 let ordered=[...items].sort((a,b)=>(baseStats(a.id).rank??999)-(baseStats(b.id).rank??999)||a.id-b.id);
 // Um jogador só ultrapassa outro se tiver pontuação maior (ou desempate
 // por presenças) E o atleta imediatamente à frente não tiver bônus.
 // Rodadas novas atualizam os pontos, mas não removem proteção existente.
 let changed=true,passes=0;
 while(changed&&passes++<ordered.length){
   changed=false;
   for(let i=1;i<ordered.length;i++){
     let ahead=ordered[i-1],behind=ordered[i];
     if(ahead.bonus!==null)continue;
     if(behind.points>ahead.points||(behind.points===ahead.points&&behind.attendance>ahead.attendance)){
       ordered[i-1]=behind;ordered[i]=ahead;changed=true;
     }
   }
 }
 return ordered;
}
function ranking(){let list=protectedRanking(db.players.map(p=>{let b=baseStats(p.id);return {...p,gols:b.goals+Object.entries(db.rounds).filter(([d,r])=>d>HIST_FINAL&&r.finalizedAt).reduce((n,[,r])=>n+(r.goalEvents||[]).filter(e=>e.playerId===p.id&&!e.ownGoal).length,0),points:points(p),bonus:bonusState(p),attendance:b.attendance+Object.entries(db.rounds).filter(([d,r])=>d>HIST_FINAL&&r.finalizedAt).filter(([,r])=>r.attendance[p.id]?.status==='Presente').length,wins:b.wins+newWins(p.id)}}));return `<div class="panel"><h2>Lista 2026 — base oficial da planilha + novas rodadas</h2><p class="note">Base acumulada da planilha preservada (13/01 a 13/10/2026), sem exibir os 37 jogos antigos no Histórico. Pontos, bônus, gols, presenças e vitórias iniciais usam o fechamento da planilha de 13/10; rodadas posteriores são acrescentadas sem duplicação. A ordem original da planilha é respeitada. Bônus 2 → 1 → 0 → —: o zero ainda protege a posição; o traço significa ausência de proteção. Zeros antigos são inferidos pelo histórico quando possível. Pontos e bônus nunca negativos. Os registros individuais de cada gol/chegada anteriores não estão disponíveis como eventos completos.</p><div class="scroll"><table class="table"><thead><tr><th>#</th><th>Atleta</th><th>Pontos</th><th>Bônus</th><th>Gols</th><th>Presenças</th><th>Vitórias</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.points}</td><td>${p.bonus===null?'—':p.bonus}</td><td>${p.gols}</td><td>${p.attendance}</td><td>${p.wins}</td></tr>`).join('')}</tbody></table></div></div>`}
// Estatísticas de partidas finalizadas no aplicativo (sem duplicar a base Excel).
function completedRounds(){return Object.entries(db.rounds||{}).filter(([date,r])=>date>HIST_FINAL&&r&&r.finalizedAt).sort(([a],[b])=>a.localeCompare(b))}
function newGames(id){return completedRounds().filter(([,r])=>{const t=r.finalTeams||r.teams;if(!t)return false;const ids=[...(t.red||[]),...(t.blue||[]),...(t.bench?.red||[]),...(t.bench?.blue||[]),...(t.goalkeepers?.red||[]),...(t.goalkeepers?.blue||[])];return ids.some(x=>Number(x)===Number(id))}).length}
function newWins(id){return completedRounds().filter(([,r])=>{const t=r.finalTeams||r.teams;if(!t)return false;const side=[...(t.red||[]),...(t.bench?.red||[]),...(t.goalkeepers?.red||[])].some(x=>Number(x)===Number(id))?'Vermelho':[...(t.blue||[]),...(t.bench?.blue||[]),...(t.goalkeepers?.blue||[])].some(x=>Number(x)===Number(id))?'Azul':null;return side&&r.finalResult===side}).length}
function statsAll(){return db.players.map(p=>{let b=baseStats(p.id);let historicGames=Number(b.attendance)||0;let games=historicGames+newGames(p.id);let wins=(Number(b.wins)||0)+newWins(p.id);let presence=historicGames+completedRounds().filter(([,r])=>r.attendance[p.id]?.status==='Presente').length;let goals=(Number(b.goals)||0)+completedRounds().reduce((n,[,r])=>n+(r.finalGoals||r.goalEvents||[]).filter(g=>g.playerId===p.id&&!g.ownGoal).length,0);return {...p,games,wins,presence,goals,pct:games?100*wins/games:0}})}
function artilharia(){let list=statsAll().sort((a,b)=>b.goals-a.goals||b.games-a.games||a.name.localeCompare(b.name));return `<div class="panel"><h2>⚽ Artilharia 2026</h2><p class="note">Base inicial: gols acumulados da última planilha enviada (fechamento em 13/10/2026). As novas rodadas finalizadas somam seus gols sem duplicar o histórico.</p><p class="note">Gols normais do histórico e das partidas finalizadas. Gol contra não entra na artilharia.</p><div class="scroll"><table class="table"><thead><tr><th>#</th><th>Atleta</th><th>Gols</th><th>Jogos</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td><strong>${p.goals}</strong></td><td>${p.games}</td></tr>`).join('')}</tbody></table></div></div>`}
function yearRounds(){let year=Number(roundId.slice(0,4));let dates=new Set(HISTORICO_EXCEL.filter(h=>Number(h.date.slice(0,4))===year).map(h=>h.date));completedRounds().forEach(([date])=>{if(Number(date.slice(0,4))===year)dates.add(date)});return dates.size}
function desempenho(){let total=yearRounds();let year=Number(roundId.slice(0,4));let list=statsAll().map(p=>({...p,frequency:total?100*p.presence/total:0,qualified:total>0&&p.presence*2>=total}));let qualified=list.filter(p=>p.qualified).sort((a,b)=>b.pct-a.pct||b.games-a.games||a.name.localeCompare(b.name));let unqualified=list.filter(p=>!p.qualified).sort((a,b)=>b.frequency-a.frequency||b.pct-a.pct||a.name.localeCompare(b.name));return `<div class="panel"><h2>🏅 Desempenho — Bola de Ouro ${year}</h2><p class="note">Base inicial: jogos, presenças e vitórias acumulados da última planilha de 2026. Novos resultados entram após a finalização da partida.</p><div class="grid"><div class="stat"><strong>${total}</strong>Rodadas finalizadas no ano</div><div class="stat"><strong>${Math.ceil(total/2)}</strong>Presenças mínimas (50%)</div><div class="stat"><strong>${qualified.length}</strong>Atletas habilitados</div></div><p class="note">Elegibilidade: pelo menos 50% das rodadas do ano (exatamente 50% também habilita). Ordem do Bola de Ouro: maior percentual de vitórias e, no empate, maior número de jogos. Rodadas novas só contam após finalizar. Presenças históricas usam os totais importados da planilha e precisam ser validadas para a temporada.</p><h3>🏆 Classificação — Habilitados</h3>${performanceTable(qualified,true,total)}<h3>⏳ Ainda não habilitados</h3>${performanceTable(unqualified,false,total)}</div>`}
function performanceTable(list,ranked,total){if(!list.length)return '<p class="note">Nenhum atleta nesta categoria.</p>';return `<div class="scroll"><table class="table"><thead><tr><th>${ranked?'#':'Status'}</th><th>Atleta</th><th>Presenças no ano</th><th>Rodadas do ano</th><th>% Presença</th><th>Jogos</th><th>Vitórias</th><th>% Vitórias</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${ranked?i+1:'—'}</td><td>${esc(p.name)}</td><td>${p.presence}</td><td>${total}</td><td>${p.frequency.toFixed(1).replace('.',',')}%</td><td>${p.games}</td><td>${p.wins}</td><td><strong>${p.pct.toFixed(1).replace('.',',')}%</strong></td></tr>`).join('')}</tbody></table></div>`}

async function deleteFinishedRound(date){if(!isAdmin()){alert('Somente o administrador pode apagar rodadas.');return}let r=db.rounds[date];if(!r||!r.finalizedAt){alert('Rodada finalizada não encontrada.');return}if(date<=HIST_FINAL){alert('Histórico original importado não pode ser apagado por esta função.');return}if(!await reauthenticateAdmin('Excluir rodada '+date))return;if(!confirm('ATENÇÃO: você tem certeza de que deseja APAGAR DEFINITIVAMENTE a rodada '+date+'? Todos os gols, times, presenças e resultados desta rodada serão excluídos das estatísticas.'))return;delete db.rounds[date];save();if(roundId===date)roundId=tuesday(new Date());tab='historico';show();alert('Rodada apagada. As estatísticas foram recalculadas.')}

let supa=null,authUser=null;
function supabaseReady(){let c=window.TERCA_CONFIG||{};return !!(c.url&&c.anonKey&&c.adminEmail&&window.supabase?.createClient)}
async function initAuth(){db.admin=false;if(!supabaseReady()){show();return}try{supa=window.supabase.createClient(window.TERCA_CONFIG.url,window.TERCA_CONFIG.anonKey);let {data,error}=await supa.auth.getUser();if(!error)authUser=data.user||null;supa.auth.onAuthStateChange((event,session)=>{authUser=session?.user||null;show();if(event==='PASSWORD_RECOVERY')setTimeout(async()=>{let password=prompt('Nova senha de recuperação (mínimo 12 caracteres):');if(!password||password.length<12)return alert('Senha não alterada.');let {error}=await supa.auth.updateUser({password});if(error)return alert(error.message);await supa.auth.signOut();authUser=null;show();alert('Senha redefinida. Entre novamente.')},0)});show()}catch(e){console.error('Erro ao inicializar autenticação',e);show()}}
async function login(){if(!supa)return alert('Configure supabase-config.js com os dados públicos do seu projeto Supabase.');if(isAdmin()){await supa.auth.signOut();authUser=null;show();return}let email=prompt('E-mail do administrador:');if(email===null)return;email=email.trim().toLowerCase();if(email!==String(window.TERCA_CONFIG.adminEmail).toLowerCase())return alert('E-mail não autorizado para administração.');let password=prompt('Senha do administrador (Supabase Auth):');if(password===null)return;let {data,error}=await supa.auth.signInWithPassword({email,password});if(error){alert('Não foi possível entrar. Confira o e-mail, senha e confirmação de e-mail.');return}authUser=data.user;if(!isAdmin()){await supa.auth.signOut();authUser=null;alert('Esta conta não tem permissão administrativa.')}show()}
async function reauthenticateAdmin(action){if(!isAdmin()||!supa)return false;let pwd=prompt('Confirme sua senha atual para: '+action);if(!pwd)return false;let {error}=await supa.auth.signInWithPassword({email:authUser.email,password:pwd});if(error){alert('Senha atual incorreta.');return false}return true}
async function changeAdminPassword(){if(!isAdmin()||!supa)return;let current=prompt('Senha atual:');if(current===null)return;let {error:loginError}=await supa.auth.signInWithPassword({email:authUser.email,password:current});if(loginError)return alert('Senha atual incorreta.');let next=prompt('Nova senha (mínimo de 12 caracteres):');if(next===null)return;if(next.length<12)return alert('Use pelo menos 12 caracteres.');let confirmPwd=prompt('Repita a nova senha:');if(confirmPwd!==next)return alert('As senhas não coincidem.');let {error}=await supa.auth.updateUser({password:next});if(error)return alert('Não foi possível alterar a senha: '+error.message);await supa.auth.signOut();authUser=null;show();alert('Senha alterada. Entre novamente com a nova senha.')}
async function resetAdminPassword(){if(!supa)return alert('Supabase ainda não configurado.');let email=String(window.TERCA_CONFIG.adminEmail||'');if(!email)return alert('Defina o e-mail do administrador.');let {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return alert('Erro ao solicitar recuperação: '+error.message);alert('Se a conta estiver cadastrada, o e-mail de recuperação será enviado.')}
function resetRound(){if(!mustAdmin())return;if(roundId<=HIST_FINAL){alert('Rodada histórica protegida. Escolha uma data posterior a 13/10/2026.');return}if(confirm('Apagar presença, times e placar desta rodada?')){delete db.rounds[roundId];if(db.activeRound===roundId)db.activeRound=null;save();show()}}function exportData(){let blob=new Blob([JSON.stringify({...db,admin:false},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='terca-fc-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(){if(!mustAdmin())return;let el=document.createElement('input');el.type='file';el.accept='.json';el.onchange=()=>{let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.players)||!d.rounds||!d.votes)throw Error('Formato inválido');if(confirm('Substituir todos os dados atuais pelo backup?')){db={...d,admin:false};save();show()}}catch(e){alert(e.message)}};reader.readAsText(el.files[0])};el.click()};initAuth();
</script></body></html>
